name: Localize and validate English website

on:
  push:
    paths:
      - '.github/workflows/localize-english.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  english-website:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout destination
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Translate site copy and public routes
        run: python3 scripts/localize-english.py
      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate production build
        run: npm run build
      - name: Commit complete English version
        run: |
          git add -A
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Publica template odontologico em ingles'
            git push origin HEAD:main
          fi
